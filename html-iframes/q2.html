<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google Map Embed</title>
</head>
<body>
  <h2>My City on Google Map</h2>

  <!-- Embedding a Google Map of Mathura (example) -->
  <iframe
    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14233.529547305386!2d77.654363!3d27.492413!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3973718e2b2ffdf3%3A0xe53f9b0c5015a21!2sMathura%2C%20Uttar%20Pradesh!5e0!3m2!1sen!2sin!4v1690000000000!5m2!1sen!2sin"
    title="Map showing Mathura City"
    width="80%"
    height="400"
    loading="lazy"
    style="border:0;"
    allowfullscreen>
  </iframe>

  <!-- Comment explaining the loading attribute -->
  <!-- The loading="lazy" attribute tells the browser to load the iframe only when it becomes visible on the screen, improving page speed. -->
</body>
</html>
