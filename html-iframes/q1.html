<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Video Embed</title>
</head>
<body>
  <h2>Responsive YouTube Video</h2>

  <!-- The width and height are in percentage so that video resizes with the browser -->
  <iframe 
    width="80%" 
    height="60%" 
    src="https://www.youtube.com/embed/dQw4w9WgXcQ" 
    title="YouTube video player" 
    frameborder="0"
    allowfullscreen>
  </iframe>

  <p>Resize the browser window to see the video adjust automatically.</p>
</body>
</html>
