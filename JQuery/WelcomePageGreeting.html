<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Q1 - Welcome Greeting</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Welcome Site</h1>
  </header>

  <main>
    <section id="welcome-section" aria-labelledby="welcome-heading">
      <h2 id="welcome-heading">Welcome</h2>
      <p id="greeting-text">Loading greeting...</p>
      <p id="welcome-message">We're glad you're here. Enjoy exploring!</p>

      <button id="change-greeting-btn">Change Greeting</button>
      <button id="toggle-welcome-btn">Toggle Welcome Message</button>
    </section>
  </main>

  <footer>
    <small>© Example</small>
  </footer>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="WelcomePageGreeting.js"></script>
</body>
</html>
