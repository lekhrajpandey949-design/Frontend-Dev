<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dark Calculator UI</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background-color: #000;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .calculator {
      width: 300px;
      background-color: #000;
      border-radius: 25px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .display {
      width: 100%;
      height: 80px;
      background: transparent;
      color: #fff;
      font-size: 48px;
      text-align: right;
      border: none;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 65px;
      width: 65px;
      border: none;
      border-radius: 50px;
      font-size: 22px;
      font-weight: 500;
      color: #fff;
      background-color: #1a1a1a;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background-color: #2a2a2a;
    }

    .operator {
      color:white;
       background-color: #ff9500;
    }
    
    .operators{
      color:white;
      background-color: darkgray ;
    }
      .operatorss{
      color:white;
    

    }
    


    .equal {
      background-color: #ff9500;
      color: #fff;
    }

    .equal:hover {
      background-color: #ffaa33;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <input type="text" class="display" value="0" disabled />

    <div class="buttons">
      <button class="operators">AC</button>
      <button class="operators">⌫</button>
      <button class="operators">%</button>
      <button class="operator">÷</button>

      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button class="operator">×</button>

      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button class="operator">−</button>

      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button class="operator">+</button>

      <button class="operatorss">±</button>
      <button>0</button>
      <button>.</button>
      <button class="equal">=</button>
    </div>
  </div>
</body>
</html>
