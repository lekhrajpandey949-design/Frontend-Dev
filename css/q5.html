<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing Table</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fa;
      color: #333;
      margin: 0;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
    }

    .pricing-container {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .plan {
      background: white;
      border: 2px solid #ddd;
      border-radius: 10px;
      width: 280px;
      padding: 20px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .plan:hover {
      transform: scale(1.05);
      background: #e8f5e9;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .popular {
      border: 2px solid #4caf50;
    }

    h2 {
      color: #4caf50;
    }

    ul {
      list-style: none;
      margin: 15px 0;
      padding: 0;
    }

    ul li {
      margin: 10px 0;
    }

    .price {
      font-size: 1.5em;
      color: #333;
      margin: 15px 0;
    }

    a {
      display: inline-block;
      background: #4caf50;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      text-decoration: none;
      transition: background 0.3s;
    }

    a:hover {
      background: #388e3c;
    }
  </style>
</head>
<body>
  <h1>Our Pricing Plans</h1>
  <div class="pricing-container">
    <div class="plan">
      <h2>Basic</h2>
      <ul>
        <li>5 GB Storage</li>
        <li>Email Support</li>
        <li>1 User</li>
      </ul>
      <div class="price">₹199/month</div>
      <a href="#">Buy Now</a>
    </div>

    <div class="plan popular">
      <h2>Standard</h2>
      <ul>
        <li>50 GB Storage</li>
        <li>Priority Support</li>
        <li>5 Users</li>
      </ul>
      <div class="price">₹499/month</div>
      <a href="#">Buy Now</a>
    </div>

    <div class="plan">
      <h2>Premium</h2>
      <ul>
        <li>200 GB Storage</li>
        <li>24/7 Support</li>
        <li>Unlimited Users</li>
      </ul>
      <div class="price">₹999/month</div>
      <a href="#">Buy Now</a>
    </div>
  </div>
</body>
</html>
