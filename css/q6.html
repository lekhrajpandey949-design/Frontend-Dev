<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Gallery</title>
  <style>
    body {
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
      font-family: Arial;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      box-shadow: 0 5px 10px rgba(0, 0, 0, 0.2);
    }

    .gallery-item img {
      width: 100%;
      display: block;
      transition: transform 0.3s;
    }

    .gallery-item:hover img {
      transform: scale(1.1);
    }

    .caption {
      position: absolute;
      bottom: 0;
      width: 100%;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s;
      padding: 10px 0;
    }

    .gallery-item:hover .caption {
      opacity: 1;
    }
  </style>
</head>
<body>
  <h1>Beautiful Gallery</h1>
  <div class="gallery">
    <div class="gallery-item"><img src="https://picsum.photos/300/200?1"><div class="caption">Nature</div></div>
    <div class="gallery-item"><img src="https://picsum.photos/300/200?2"><div class="caption">Mountains</div></div>
    <div class="gallery-item"><img src="https://picsum.photos/300/200?3"><div class="caption">River</div></div>
    <div class="gallery-item"><img src="https://picsum.photos/300/200?4"><div class="caption">Forest</div></div>
    <div class="gallery-item"><img src="https://picsum.photos/300/200?5"><div class="caption">City</div></div>
    <div class="gallery-item"><img src="https://picsum.photos/300/200?6"><div class="caption">Beach</div></div>
  </div>
</body>
</html>
