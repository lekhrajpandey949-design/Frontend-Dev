<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lekhraj's Profile</title>

  <style>
    /* ==========
       Basic Reset
       ========== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(120deg, #e0f7fa, #ffffff);
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .profile-card {
      background: #fff;
      width: 350px;
      text-align: center;
      border-radius: 20px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      padding: 2rem 1.5rem;
    }

    .profile-card img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #00bcd4;
      margin-bottom: 1rem;
    }

    h2 {
      color: #00796b;
      font-size: 1.5rem;
    }

    p {
      font-size: 0.95rem;
      margin: 0.5rem 0 1rem;
      color: #444;
    }

    .skills {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 1.5rem;
    }

    .skills span {
      background: #e0f2f1;
      color: #00796b;
      padding: 5px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
    }

    a.button {
      display: inline-block;
      background: #00bcd4;
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 8px;
      transition: 0.3s ease;
    }

    a.button:hover {
      background: #0097a7;
    }

    footer {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #555;
    }

    @media (max-width: 400px) {
      .profile-card {
        width: 90%;
      }
    }
  </style>
</head>

<body>
  <div class="profile-card">
    <img src="https://i.pinimg.com/564x/9c/30/4f/9c304f93bba2f0dc7ff9e5a0ebf06b62.jpg" alt="Lekhraj Profile">
    <h2>Lekhraj Pandey</h2>
    <p>B.Tech CSE Student | Frontend Learner | BGMI Gamer</p>

    <div class="skills">
      <span>HTML</span>
      <span>CSS</span>
      <span>Python</span>
      <span>Java</span>
    </div>

    <a href="mailto:lekhraj@example.com" class="button">Contact Me</a>

    <footer>© 2025 Lekhraj | All Rights Reserved</footer>
  </div>
</body>
</html>
