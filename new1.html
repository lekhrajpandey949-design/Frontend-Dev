<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flipkart Clone</title>
  <link rel="stylesheet" href="style1.css" />
</head>
<body>

  <!-- Header -->
  <header class="navbar">
    <div class="logo">
      <h2>Flipkart</h2>
      <span class="plus">Plus ✨</span>
    </div>

    <div class="search-bar">
      <input type="text" placeholder="Search for products, brands and more">
      <button>🔍</button>
    </div>

    <div class="nav-links">
      <a href="#">Login</a>
      <a href="#">Cart 🛒</a>
      <a href="#">Become a Seller</a>
      <a href="#">More ▼</a>
    </div>
  </header>

  <!-- Categories -->
  <section class="categories">
    <div class="cat">Grocery</div>
    <div class="cat">Mobiles</div>
    <div class="cat">Fashion</div>
    <div class="cat">Electronics</div>
    <div class="cat">Home</div>
    <div class="cat">Appliances</div>
    <div class="cat">Beauty</div>
    <div class="cat">Toys</div>
    <div class="cat">Travel</div>
  </section>

  <!-- Banner -->
  <section class="banner">
    <img src="https://rukminim2.flixcart.com/fk-p-flap/1600/270/image.jpg?q=20" alt="Banner">
  </section>

  <!-- Product Section -->
  <section class="products">
    <h2>Best of Electronics</h2>
    <div class="product-container">
      <div class="product">
        <img src="https://rukminim2.flixcart.com/image/200/200/xif0q/mobile/m/o/b/-original-imaghxcp9cjf9h8g.jpeg?q=70" alt="">
        <p>Smartphone</p>
        <span>₹9,999</span>
      </div>
      <div class="product">
        <img src="https://rukminim2.flixcart.com/image/200/200/kpmy8i80/headphone/i/v/9/rockerz-450-boat-original-imag3vfjhyc7qghc.jpeg?q=70" alt="">
        <p>Headphones</p>
        <span>₹1,499</span>
      </div>
      <div class="product">
        <img src="https://rukminim2.flixcart.com/image/200/200/kzx1a4w0/speaker/s/x/n/-original-imagbtwc9xfgdqwv.jpeg?q=70" alt="">
        <p>Bluetooth Speaker</p>
        <span>₹1,999</span>
      </div>
      <div class="product">
        <img src="https://rukminim2.flixcart.com/image/200/200/xif0q/smartwatch/1/q/y/-original-imaghugyrzzszsnp.jpeg?q=70" alt="">
        <p>Smartwatch</p>
        <span>₹2,499</span>
      </div>
    </div>
  </section>

  <footer>
    <p>© 2025 Flipkart Clone by Lekhraj | For Practice Purpose Only</p>
  </footer>

</body>
</html>
